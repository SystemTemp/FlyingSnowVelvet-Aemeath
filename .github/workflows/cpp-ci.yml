name: C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-build-test:
    name: Windows x64 build & test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (MSVC x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter AemeathPet.Tests.exe | Select-Object -First 1
          if (-not $exe) { throw "测试可执行文件未找到" }
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "测试失败，退出码 $LASTEXITCODE" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AemeathPet-win64
          path: |
            build/**/AemeathPet.exe
            assets/**

